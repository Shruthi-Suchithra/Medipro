{% load static %}
{% include 'header.html' %}
<br><br>
	
<div class="container">
    <h1>USERS LIST</h1>
<table class="table">

      <tr>
        <th scope="col">#</th>
        <th scope="col">Photo</th>
        <th scope="col">Name</th>
        <th scope="col">Email</th>
        <th scope="col">Phone</th>
        <th scope="col">Password</th>
        <th scope="col">Delete</th>
        
        
      </tr>
    </thead>
    <tbody>
        {% for i in users %}
     
      <tr>

        <td><img src="../media/{{i.photo}}" alt="no image" style="width:200px;height:200px;"></td>
        <td>{{i.name}}</td>

  </table>
</div>
